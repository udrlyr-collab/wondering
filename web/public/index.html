<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wondering Location</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <div class="map-container">
        <div id="map"></div>
        <div class="map-status-card" aria-label="3D 지도 상태">
          <span>3D GPS TRACE</span>
          <strong id="mapInstruction">위치 수신 대기</strong>
          <small id="mapSubStatus">원본 좌표 저장 · 표시 경로 보정</small>
        </div>
        <button id="locateCurrentButton" class="locate-control" type="button" aria-label="현재 위치로 이동" title="현재 위치로 이동" disabled>
          <span class="locate-control-icon" aria-hidden="true"></span>
        </button>
      </div>
      <aside class="hud">
        <div class="brand-rail">
          <h1>Wondering<br>Location</h1>
          <p id="modeLabel" class="mode-label">Viewer</p>
          <div class="status-wrap">
            <div id="signalDot" class="signal-dot"></div>
            <p id="status">Waiting</p>
          </div>
        </div>
        <div class="readings">
          <div class="reading">
            <span>Last Received</span>
            <strong id="lastSeen">-</strong>
          </div>
          <div class="reading">
            <span>Coordinate</span>
            <strong id="coords">-</strong>
          </div>
          <div class="reading">
            <span>Distance</span>
            <strong id="distance">-</strong>
          </div>
        </div>
      </aside>
      <section id="adminPanel" class="admin-panel" hidden>
        <div class="admin-header">
          <div>
            <span>Admin Console</span>
            <h2>Wondering Control</h2>
          </div>
          <button id="lockAdminButton" type="button">Lock</button>
        </div>
        <div class="admin-grid">
          <div class="admin-section">
            <span>Viewer settings</span>
            <select id="publicPollSelect">
              <option value="5000">Refresh 5s</option>
              <option value="10000" selected>Refresh 10s</option>
              <option value="30000">Refresh 30s</option>
            </select>
            <input id="publicMaxRecordsInput" type="number" min="100" max="1500" step="100" placeholder="Max records" />
            <label class="checkbox-row">
              <input id="publicInvalidInput" type="checkbox" checked />
              <span>Show muted invalid points</span>
            </label>
            <button id="saveSettingsButton" type="button">Save settings</button>
          </div>
          <div class="admin-section">
            <span>Route tools</span>
            <input id="dateInput" type="date" />
            <select id="pollSelect">
              <option value="5000">Admin 5s</option>
              <option value="10000" selected>Admin 10s</option>
              <option value="30000">Admin 30s</option>
            </select>
          </div>
          <div class="admin-section admin-section-wide">
            <span>Upload token</span>
            <input id="newTokenInput" type="password" autocomplete="new-password" placeholder="New token" />
            <button id="generateTokenButton" type="button">Generate</button>
            <button id="rotateTokenButton" type="button">Rotate token</button>
          </div>
        </div>
        <p id="adminFeedback" class="admin-feedback"></p>
      </section>
      <section id="pinLock" class="pin-lock" hidden>
        <form id="pinForm" class="pin-card">
          <span>Admin access</span>
          <h2>Enter PIN</h2>
          <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" />
          <button id="pinSubmitButton" type="submit">Unlock</button>
          <p id="pinFeedback" class="admin-feedback"></p>
        </form>
      </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
