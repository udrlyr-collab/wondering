<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wondering Location</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <div class="map-container">
        <div id="map"></div>
        <div class="map-status-card" aria-label="3D 지도 상태">
          <span>3D GPS TRACE</span>
          <strong id="mapInstruction">위치 수신 대기</strong>
          <small id="mapSubStatus">원본 좌표 저장 · 표시 경로 보정</small>
        </div>
      </div>
      <aside class="hud">
        <div class="brand-rail">
          <h1>Wondering<br>Location</h1>
          <div class="status-wrap">
            <div id="signalDot" class="signal-dot"></div>
            <p id="status">Waiting</p>
          </div>
        </div>
        <div class="readings">
          <div class="reading">
            <span>Last Received</span>
            <strong id="lastSeen">-</strong>
          </div>
          <div class="reading">
            <span>Coordinate</span>
            <strong id="coords">-</strong>
          </div>
          <div class="reading">
            <span>Distance</span>
            <strong id="distance">-</strong>
          </div>
        </div>
        <div class="controls">
          <input id="tokenInput" type="password" autocomplete="off" placeholder="Token" />
          <input id="dateInput" type="date" />
          <select id="pollSelect">
            <option value="5000">5s</option>
            <option value="10000" selected>10s</option>
            <option value="30000">30s</option>
          </select>
          <button id="saveTokenButton" type="button">Set</button>
        </div>
      </aside>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
